<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student/Parent ID Verification - Abdul Rahman</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .id-card {
            background-color: #ffffff;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #d1d5db;
        }
        .id-header {
            background-color: #1d4ed8;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .id-body {
            padding: 24px;
            display: flex;
            gap: 20px;
        }
        .id-details {
            flex: 1;
        }
        .id-details h2 {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: #111827;
        }
        .detail-row {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .detail-label {
            font-weight: 600;
            color: #4b5563;
            width: 70px;
            display: inline-block;
        }
        .detail-value {
            color: #1f2937;
        }
        .id-footer {
            background-color: #f9fafb;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            border-top: 1px solid #e5e7eb;
        }
        .status-badge {
            display: inline-block;
            background-color: #dcfce7;
            color: #166534;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="id-card">
    <div class="id-header">
        Parent / Guardian ID
    </div>
    <div class="id-body">
        <img src="https://i.pravatar.cc/150?img=11" alt="Student Photo" style="width: 100px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #d1d5db;">
        <div class="id-details">
            <h2>Abdul Rahman</h2>
            <div class="detail-row">
                <span class="detail-label">ID No:</span>
                <span class="detail-value">PAR-982431</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Phone:</span>
                <span class="detail-value">+880 1712-345678</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Address:</span>
                <span class="detail-value">Dhanmondi, Dhaka</span>
            </div>
            <div class="status-badge">✓ Document Authenticated</div>
        </div>
    </div>
    <div class="id-footer">
        Issued by TutorHub Verification System<br>
        Valid through: Dec 2027
    </div>
</div>

</body>
</html>
